  </defs>

  <g opacity="0.08">
    <!-- Strawberry silhouette -->
    <g fill="url(#fsbForest)">
      <path d="M 110 78 C 150 70 190 96 190 134 C 190 168 150 188 110 188 C 70 188 30 168 30 134 C 30 96 70 86 110 78 Z" transform="translate(0 -8)"/>
      <path d="M 110 60 C 98 44 86 40 72 44 C 84 50 88 58 90 66 C 76 56 64 56 54 62 C 70 66 78 72 86 80 C 96 70 104 66 110 64 C 116 66 124 70 134 80 C 142 72 150 66 166 62 C 156 56 144 56 130 66 C 132 58 136 50 148 44 C 134 40 122 44 110 60 Z"/>
    </g>

    <!-- Mango silhouette -->
    <g fill="url(#fsbSage)" transform="translate(230 0)">
      <path d="M 120 60 C 180 48 230 96 222 144 C 216 182 170 196 124 188 C 78 180 44 144 56 104 C 66 72 86 66 120 60 Z"/>
      <path d="M 132 56 C 142 46 156 44 168 48 C 158 52 150 60 144 66 C 140 60 136 58 132 56 Z" fill="url(#fsbForest)"/>
    </g>

    <!-- Pineapple silhouette -->
    <g transform="translate(470 0)">
      <ellipse cx="110" cy="135" rx="58" ry="62" fill="url(#fsbGold)"/>
      <g fill="url(#fsbForest)">
        <path d="M 110 78 C 104 50 96 36 84 26 C 96 40 98 56 100 70 C 88 54 76 48 64 48 C 80 58 88 70 96 84 Z"/>
        <path d="M 110 78 C 116 50 124 36 136 26 C 124 40 122 56 120 70 C 132 54 144 48 156 48 C 140 58 132 70 124 84 Z"/>
        <path d="M 110 76 C 110 48 110 34 110 22 C 116 38 114 56 112 72 Z"/>
      </g>
    </g>

    <!-- Kiwi silhouette (sliced circle) -->
    <g transform="translate(700 0)">
      <circle cx="110" cy="130" r="58" fill="url(#fsbSage)"/>
      <circle cx="110" cy="130" r="30" fill="url(#fsbGold)"/>
      <g fill="url(#fsbForest)">
        <circle cx="110" cy="106" r="2.4"/>
        <circle cx="128" cy="114" r="2.4"/>
        <circle cx="132" cy="134" r="2.4"/>
        <circle cx="124" cy="150" r="2.4"/>
        <circle cx="110" cy="156" r="2.4"/>
        <circle cx="96" cy="150" r="2.4"/>
        <circle cx="88" cy="134" r="2.4"/>
        <circle cx="92" cy="114" r="2.4"/>
      </g>
    </g>

    <!-- Blueberry cluster silhouette -->
    <g transform="translate(920 0)" fill="url(#fsbForest)">
      <circle cx="86" cy="128" r="30"/>
      <circle cx="134" cy="118" r="34"/>
      <circle cx="112" cy="162" r="28"/>
