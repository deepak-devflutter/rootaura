<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="kiwiSkin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A6B3A"/>
      <stop offset="80%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#6B4220"/>
    </radialGradient>
    <radialGradient id="kiwiFlesh" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#EFF5DE"/>
      <stop offset="34%" stop-color="#A9CF6A"/>
      <stop offset="74%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#5E9230"/>
    </radialGradient>
    <radialGradient id="kiwiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="100%" stop-color="#EFF5DE"/>
    </radialGradient>
    <linearGradient id="kiwiSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FBF9F4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="kiwiShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123D2A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#123D2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="174" rx="54" ry="12" fill="url(#kiwiShadow)"/>
  <!-- fuzzy skin outer ring -->
  <circle cx="100" cy="100" r="74" fill="url(#kiwiSkin)"/>
  <!-- fuzz texture hint -->
  <g stroke="#6B4220" stroke-width="0.7" opacity="0.5">
    <line x1="30" y1="100" x2="26" y2="100"/>
    <line x1="170" y1="100" x2="174" y2="100"/>
    <line x1="100" y1="30" x2="100" y2="26"/>
    <line x1="100" y1="170" x2="100" y2="174"/>
    <line x1="48" y1="52" x2="45" y2="49"/>
    <line x1="152" y1="52" x2="155" y2="49"/>
    <line x1="48" y1="148" x2="45" y2="151"/>
    <line x1="152" y1="148" x2="155" y2="151"/>
  </g>
  <!-- green flesh -->
  <circle cx="100" cy="100" r="66" fill="url(#kiwiFlesh)"/>
  <!-- radial pale streaks -->
  <g stroke="#EFF5DE" stroke-width="2.2" opacity="0.55">
    <line x1="100" y1="100" x2="100" y2="40"/>
    <line x1="100" y1="100" x2="142" y2="58"/>
    <line x1="100" y1="100" x2="160" y2="100"/>
    <line x1="100" y1="100" x2="142" y2="142"/>
    <line x1="100" y1="100" x2="100" y2="160"/>
    <line x1="100" y1="100" x2="58" y2="142"/>
    <line x1="100" y1="100" x2="40" y2="100"/>
    <line x1="100" y1="100" x2="58" y2="58"/>
  </g>
  <!-- cream core -->
  <circle cx="100" cy="100" r="15" fill="url(#kiwiCore)"/>
  <!-- black seeds ring -->
  <g fill="#12110F">
    <ellipse cx="100" cy="68" rx="2" ry="2.8"/>
    <ellipse cx="118" cy="74" rx="2" ry="2.8" transform="rotate(40 118 74)"/>
    <ellipse cx="130" cy="88" rx="2" ry="2.8" transform="rotate(70 130 88)"/>
    <ellipse cx="132" cy="100" rx="2.8" ry="2"/>
    <ellipse cx="130" cy="112" rx="2" ry="2.8" transform="rotate(110 130 112)"/>
    <ellipse cx="118" cy="126" rx="2" ry="2.8" transform="rotate(140 118 126)"/>
    <ellipse cx="100" cy="132" rx="2" ry="2.8"/>
    <ellipse cx="82" cy="126" rx="2" ry="2.8" transform="rotate(40 82 126)"/>
    <ellipse cx="70" cy="112" rx="2" ry="2.8" transform="rotate(70 70 112)"/>
    <ellipse cx="68" cy="100" rx="2.8" ry="2"/>
    <ellipse cx="70" cy="88" rx="2" ry="2.8" transform="rotate(110 70 88)"/>
    <ellipse cx="82" cy="74" rx="2" ry="2.8" transform="rotate(140 82 74)"/>
    <!-- outer seed ring -->
    <ellipse cx="100" cy="50" rx="1.6" ry="2.4"/>
    <ellipse cx="128" cy="60" rx="1.6" ry="2.4" transform="rotate(35 128 60)"/>
    <ellipse cx="148" cy="84" rx="2.4" ry="1.6"/>
    <ellipse cx="150" cy="114" rx="1.6" ry="2.4" transform="rotate(115 150 114)"/>
    <ellipse cx="128" cy="140" rx="1.6" ry="2.4" transform="rotate(145 128 140)"/>
    <ellipse cx="100" cy="150" rx="1.6" ry="2.4"/>
    <ellipse cx="72" cy="140" rx="1.6" ry="2.4" transform="rotate(35 72 140)"/>
    <ellipse cx="52" cy="114" rx="2.4" ry="1.6"/>
    <ellipse cx="50" cy="84" rx="1.6" ry="2.4" transform="rotate(115 50 84)"/>
    <ellipse cx="72" cy="60" rx="1.6" ry="2.4" transform="rotate(145 72 60)"/>
  </g>
  <!-- freeze-dried air pockets -->
  <g fill="#FBF9F4" opacity="0.45">
    <circle cx="112" cy="86" r="1.1"/>
    <circle cx="88" cy="116" r="1"/>
    <circle cx="120" cy="118" r="0.9"/>
  </g>
  <!-- top sheen -->
  <path d="M100 34 C134 34 162 60 166 94 C150 64 128 50 100 50 C72 50 50 64 34 94 C38 60 66 34 100 34 Z" fill="url(#kiwiSheen)"/>
