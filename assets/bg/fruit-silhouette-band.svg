    <!-- Banana silhouette -->
    <g transform="translate(1010 0)" fill="url(#fsbGold)">
      <path d="M 70 70 C 64 110 84 150 134 168 C 176 182 196 174 188 162 C 160 168 132 156 110 132 C 90 110 84 90 88 72 C 88 64 78 62 70 70 Z"/>
