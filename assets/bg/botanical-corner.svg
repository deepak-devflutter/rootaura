<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bcStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#123D2A"/>
    </linearGradient>
    <linearGradient id="bcLeafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BAE95"/>
      <stop offset="1" stop-color="#1E6F43"/>
    </linearGradient>
    <linearGradient id="bcLeafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#123D2A"/>
    </linearGradient>
    <radialGradient id="bcBerry" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E8A0AB"/>
      <stop offset="0.5" stop-color="#D6334C"/>
      <stop offset="1" stop-color="#B81F38"/>
    </radialGradient>
    <radialGradient id="bcBerryGold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#EADFC6"/>
      <stop offset="1" stop-color="#B0852F"/>
    </radialGradient>
  </defs>

  <!-- Corner flourish anchored top-left, opening into the canvas -->
  <g opacity="0.5">
    <!-- Main arcing stem -->
    <path d="M -10 -10 C 60 30 90 90 110 160 C 124 210 150 250 210 280"
          stroke="url(#bcStem)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Secondary stem -->
    <path d="M 20 10 C 70 50 70 120 40 180"
          stroke="url(#bcStem)" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Leaves along main stem -->
    <g>
      <path d="M 65 35 C 95 18 130 26 142 56 C 118 70 88 64 65 35 Z" fill="url(#bcLeafA)"/>
      <path d="M 70 40 C 95 44 118 50 138 56" stroke="#123D2A" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <path d="M 95 100 C 70 78 36 80 22 110 C 48 128 80 122 95 100 Z" fill="url(#bcLeafB)"/>
      <path d="M 90 105 C 66 108 46 112 26 110" stroke="#123D2A" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <path d="M 118 160 C 150 146 188 158 198 190 C 170 202 138 192 118 160 Z" fill="url(#bcLeafA)"/>
      <path d="M 124 166 C 150 172 174 180 192 188" stroke="#123D2A" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <path d="M 135 215 C 110 196 76 200 64 232 C 92 248 122 238 135 215 Z" fill="url(#bcLeafB)"/>
      <path d="M 130 220 C 106 224 86 228 68 230" stroke="#123D2A" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <path d="M 168 255 C 200 244 236 258 244 288 C 216 298 186 286 168 255 Z" fill="url(#bcLeafA)"/>
      <path d="M 174 261 C 200 268 222 276 238 286" stroke="#123D2A" stroke-width="1.4" fill="none"/>
    </g>

    <!-- Berry clusters -->
    <circle cx="206" cy="284" r="9" fill="url(#bcBerry)"/>
    <circle cx="224" cy="296" r="7" fill="url(#bcBerry)"/>
    <circle cx="218" cy="276" r="6" fill="url(#bcBerryGold)"/>
    <circle cx="44" cy="186" r="7.5" fill="url(#bcBerry)"/>
    <circle cx="56" cy="200" r="6" fill="url(#bcBerryGold)"/>
    <circle cx="146" cy="58" r="6.5" fill="url(#bcBerry)"/>
    <circle cx="160" cy="68" r="5" fill="url(#bcBerryGold)"/>

    <!-- Tiny sprig accents -->
    <path d="M 250 290 C 270 286 286 296 296 314" stroke="url(#bcStem)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 30 200 C 22 222 30 244 50 258" stroke="url(#bcStem)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
