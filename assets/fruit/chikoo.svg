<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="chikooBody" cx="40%" cy="32%" r="76%">
      <stop offset="0%" stop-color="#B58A5E"/>
      <stop offset="36%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#6B4220"/>
    </radialGradient>
    <radialGradient id="chikooFlesh" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#D9A86E"/>
      <stop offset="60%" stop-color="#B27A45"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </radialGradient>
    <linearGradient id="chikooSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FBF9F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chikooLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BAE95"/>
      <stop offset="100%" stop-color="#1E6F43"/>
    </linearGradient>
    <radialGradient id="chikooShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123D2A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#123D2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chikooSeed" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4A3320"/>
      <stop offset="100%" stop-color="#12110F"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="176" rx="54" ry="12" fill="url(#chikooShadow)"/>
  <!-- whole chikoo (left, slightly behind) -->
  <ellipse cx="74" cy="108" rx="46" ry="50" fill="url(#chikooBody)"/>
  <!-- sandy russet speckle texture -->
  <g fill="#6B4220" opacity="0.45">
    <circle cx="56" cy="84" r="1.3"/><circle cx="70" cy="74" r="1.1"/>
    <circle cx="88" cy="86" r="1.2"/><circle cx="50" cy="108" r="1.2"/>
    <circle cx="66" cy="118" r="1.1"/><circle cx="86" cy="120" r="1.3"/>
    <circle cx="58" cy="134" r="1.1"/><circle cx="78" cy="142" r="1.2"/>
    <circle cx="96" cy="104" r="1"/>
  </g>
  <g fill="#C9A06E" opacity="0.5">
    <circle cx="62" cy="90" r="1"/><circle cx="80" cy="100" r="1"/>
    <circle cx="54" cy="120" r="0.9"/><circle cx="72" cy="130" r="0.9"/>
  </g>
  <!-- sheen on whole -->
  <path d="M74 58 C98 58 116 76 118 100 C108 82 92 74 74 74 C56 74 40 82 30 100 C32 76 50 58 74 58 Z" fill="url(#chikooSheen)"/>
  <!-- tiny stem on whole -->
  <path d="M74 60 C74 52 76 46 80 42 C77 48 77 54 78 60 Z" fill="#6B4220"/>

  <!-- cut half (right, foreground) -->
  <path d="M132 64 C158 66 174 92 170 126 C166 158 142 176 116 174 C114 138 116 100 122 80 C124 72 128 66 132 64 Z" fill="url(#chikooBody)"/>
  <!-- inner flesh -->
  <path d="M126 70 C150 72 164 96 160 126 C156 154 136 170 116 170 C115 136 117 102 122 84 C123 78 124 73 126 70 Z" fill="url(#chikooFlesh)"/>
  <!-- flesh sheen -->
  <path d="M128 76 C146 80 156 100 154 124 C150 102 138 88 122 86 C123 82 125 78 128 76 Z" fill="#E0BB88" opacity="0.5"/>
  <!-- grainy flesh texture lines radiating -->
  <g stroke="#8B5A2B" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M132 120 C146 110 152 100 154 90"/>
    <path d="M130 124 C146 122 156 124 162 130"/>
    <path d="M130 128 C144 134 150 144 152 154"/>
    <path d="M128 116 C138 104 142 92 142 82"/>
  </g>
  <!-- glossy black seeds -->
  <ellipse cx="136" cy="116" rx="5" ry="8" fill="url(#chikooSeed)" transform="rotate(12 136 116)"/>
  <ellipse cx="146" cy="132" rx="4.5" ry="7" fill="url(#chikooSeed)" transform="rotate(-8 146 132)"/>
  <ellipse cx="128" cy="134" rx="4" ry="6.5" fill="url(#chikooSeed)" transform="rotate(20 128 134)"/>
  <!-- seed highlights -->
  <ellipse cx="134" cy="112" rx="1.2" ry="2" fill="#9A8268" opacity="0.7"/>
  <ellipse cx="144" cy="128" rx="1" ry="1.8" fill="#9A8268" opacity="0.7"/>
  <!-- freeze-dried air pockets in flesh -->
  <g fill="#FBF9F4" opacity="0.4">
    <circle cx="124" cy="100" r="1"/>
    <circle cx="150" cy="110" r="0.9"/>
    <circle cx="120" cy="150" r="0.9"/>
  </g>
  <!-- leaf accent -->
  <path d="M132 64 C140 54 152 50 164 52 C152 56 144 62 138 72 C136 68 134 66 132 64 Z" fill="url(#chikooLeaf)"/>
</svg>
