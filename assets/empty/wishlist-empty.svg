  <path d="M120 80 q9 -10 20 -10 q-6 12 -20 10 Z" fill="url(#wlLeaf)"/>
  <path d="M120 80 q-9 -10 -20 -10 q6 12 20 10 Z" fill="#7BAE95"/>
  <!-- sparkles -->
  <path d="M62 70 l1.8 5.4 l5.4 1.8 l-5.4 1.8 l-1.8 5.4 l-1.8 -5.4 l-5.4 -1.8 l5.4 -1.8 Z" fill="#B0852F" opacity="0.9"/>
  <path d="M180 78 l1.6 4.8 l4.8 1.6 l-4.8 1.6 l-1.6 4.8 l-1.6 -4.8 l-4.8 -1.6 l4.8 -1.6 Z" fill="#EADFC6"/>
  <circle cx="76" cy="120" r="2" fill="#EADFC6"/>
  <circle cx="166" cy="118" r="2" fill="#B0852F"/>
