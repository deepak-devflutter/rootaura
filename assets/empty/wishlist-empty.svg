<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <radialGradient id="wlBg" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#EDF3EE"/>
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wlHeart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EADFC6"/>
      <stop offset="50%" stop-color="#B0852F"/>
      <stop offset="100%" stop-color="#8A6722"/>
    </linearGradient>
    <radialGradient id="wlBerry" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#E8A0AB"/>
      <stop offset="45%" stop-color="#D6334C"/>
      <stop offset="100%" stop-color="#B81F38"/>
    </radialGradient>
    <linearGradient id="wlLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#1E6F43"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="94" rx="98" ry="80" fill="url(#wlBg)"/>
  <ellipse cx="120" cy="168" rx="56" ry="8" fill="#123D2A" opacity="0.12"/>
  <!-- soft fill behind heart -->
  <path d="M120 138 C 84 110 70 88 70 70 C 70 52 86 44 100 50 C 110 54 118 64 120 70 C 122 64 130 54 140 50 C 154 44 170 52 170 70 C 170 88 156 110 120 138 Z" fill="#FBF9F4" opacity="0.55"/>
  <!-- outline heart -->
  <path d="M120 138 C 84 110 70 88 70 70 C 70 52 86 44 100 50 C 110 54 118 64 120 70 C 122 64 130 54 140 50 C 154 44 170 52 170 70 C 170 88 156 110 120 138 Z" fill="none" stroke="url(#wlHeart)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M120 138 C 84 110 70 88 70 70 C 70 52 86 44 100 50 C 110 54 118 64 120 70 C 122 64 130 54 140 50 C 154 44 170 52 170 70 C 170 88 156 110 120 138 Z" fill="none" stroke="#FBF9F4" stroke-width="1.4" stroke-linejoin="round" opacity="0.45"/>
  <!-- berry nestled in heart -->
  <circle cx="120" cy="92" r="14" fill="url(#wlBerry)"/>
  <circle cx="115" cy="87" r="1.3" fill="#F4D03F"/>
  <circle cx="124" cy="89" r="1.3" fill="#F4D03F"/>
  <circle cx="118" cy="96" r="1.3" fill="#F4D03F"/>
  <circle cx="126" cy="96" r="1.3" fill="#F4D03F"/>
