<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <radialGradient id="seBg" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#EDF3EE"/>
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EADFC6"/>
      <stop offset="50%" stop-color="#B0852F"/>
      <stop offset="100%" stop-color="#EADFC6"/>
    </linearGradient>
    <radialGradient id="seLens" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FBF9F4" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#EDF3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7BAE95" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="seLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#1E6F43"/>
    </linearGradient>
    <linearGradient id="seHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0852F"/>
      <stop offset="100%" stop-color="#8A6722"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="96" rx="98" ry="80" fill="url(#seBg)"/>
  <ellipse cx="120" cy="170" rx="62" ry="9" fill="#123D2A" opacity="0.12"/>
  <!-- leaf under lens -->
  <path d="M118 116 q34 -8 56 -36 q-10 40 -56 36 Z" fill="url(#seLeaf)"/>
  <path d="M118 116 q30 -8 50 -32" fill="none" stroke="#7BAE95" stroke-width="1.6"/>
  <path d="M150 96 q8 -6 12 -16" fill="none" stroke="#7BAE95" stroke-width="1.2"/>
  <path d="M138 104 q8 -6 12 -16" fill="none" stroke="#7BAE95" stroke-width="1.2"/>
  <path d="M104 112 q-22 -6 -34 -24 q22 24 34 24 Z" fill="#7BAE95" opacity="0.85"/>
  <!-- magnifier handle -->
  <rect x="138" y="118" width="13" height="44" rx="6" transform="rotate(-42 144 140)" fill="url(#seHandle)"/>
  <!-- magnifier ring -->
  <circle cx="110" cy="86" r="38" fill="url(#seLens)"/>
  <circle cx="110" cy="86" r="38" fill="none" stroke="url(#seRing)" stroke-width="7"/>
  <circle cx="110" cy="86" r="38" fill="none" stroke="#123D2A" stroke-width="1" opacity="0.25"/>
  <!-- lens glint -->
  <path d="M92 70 q8 -10 22 -12" fill="none" stroke="#FBF9F4" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <!-- sparkles -->
  <path d="M168 60 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#B0852F" opacity="0.9"/>
  <path d="M62 96 l1.4 4.2 l4.2 1.4 l-4.2 1.4 l-1.4 4.2 l-1.4 -4.2 l-4.2 -1.4 l4.2 -1.4 Z" fill="#EADFC6"/>
</svg>
