<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="fsbForest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#1E6F43"/>
    </linearGradient>
    <linearGradient id="fsbSage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BAE95"/>
      <stop offset="1" stop-color="#2E8B57"/>
    </linearGradient>
    <linearGradient id="fsbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EADFC6"/>
      <stop offset="1" stop-color="#B0852F"/>
