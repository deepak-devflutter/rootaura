<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <radialGradient id="osBg" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#EDF3EE"/>
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="osDisc" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="60%" stop-color="#1E6F43"/>
      <stop offset="100%" stop-color="#123D2A"/>
    </radialGradient>
    <linearGradient id="osRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EADFC6"/>
      <stop offset="50%" stop-color="#B0852F"/>
      <stop offset="100%" stop-color="#EADFC6"/>
    </linearGradient>
    <linearGradient id="osLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BAE95"/>
      <stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="100" rx="98" ry="82" fill="url(#osBg)"/>
  <ellipse cx="120" cy="168" rx="58" ry="8" fill="#123D2A" opacity="0.12"/>
  <!-- leaf burst behind medallion -->
  <g opacity="0.95">
    <path d="M120 96 q-30 -34 -52 -36 q14 30 52 36 Z" fill="url(#osLeaf)" opacity="0.85"/>
    <path d="M120 96 q30 -34 52 -36 q-14 30 -52 36 Z" fill="url(#osLeaf)" opacity="0.85"/>
    <path d="M120 96 q-22 -40 -16 -62 q22 26 16 62 Z" fill="#1E6F43" opacity="0.8"/>
    <path d="M120 96 q22 -40 16 -62 q-22 26 -16 62 Z" fill="#1E6F43" opacity="0.8"/>
  </g>
  <!-- medallion -->
  <circle cx="120" cy="100" r="46" fill="url(#osRing)"/>
  <circle cx="120" cy="100" r="40" fill="url(#osDisc)"/>
  <circle cx="120" cy="100" r="40" fill="none" stroke="#EADFC6" stroke-width="1" opacity="0.4"/>
  <!-- check -->
  <path d="M102 100 l12 13 l24 -28" fill="none" stroke="#EADFC6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M102 100 l12 13 l24 -28" fill="none" stroke="#FBF9F4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- ribbon tails -->
  <path d="M104 142 l-8 26 l12 -8 l8 -16 Z" fill="#B0852F"/>
  <path d="M136 142 l8 26 l-12 -8 l-8 -16 Z" fill="#EADFC6"/>
  <!-- sparkles -->
  <path d="M64 86 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#B0852F"/>
  <path d="M178 78 l1.6 4.8 l4.8 1.6 l-4.8 1.6 l-1.6 4.8 l-1.6 -4.8 l-4.8 -1.6 l4.8 -1.6 Z" fill="#EADFC6"/>
  <circle cx="174" cy="124" r="2" fill="#B0852F"/>
  <circle cx="70" cy="128" r="2" fill="#EADFC6"/>
</svg>
