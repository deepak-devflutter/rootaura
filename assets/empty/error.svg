<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <radialGradient id="erBg" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#EDF3EE"/>
      <stop offset="100%" stop-color="#FBF9F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="erPouch" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="55%" stop-color="#1E6F43"/>
      <stop offset="100%" stop-color="#123D2A"/>
    </linearGradient>
    <linearGradient id="erGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EADFC6"/>
      <stop offset="100%" stop-color="#B0852F"/>
    </linearGradient>
    <radialGradient id="erBerry" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#E8A0AB"/>
      <stop offset="45%" stop-color="#D6334C"/>
      <stop offset="100%" stop-color="#B81F38"/>
    </radialGradient>
    <radialGradient id="erMango" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FBD38D"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E07B1A"/>
    </radialGradient>
    <linearGradient id="erLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BAE95"/>
      <stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="98" rx="98" ry="80" fill="url(#erBg)"/>
  <ellipse cx="124" cy="158" rx="72" ry="10" fill="#123D2A" opacity="0.12"/>
  <!-- tipped-over pouch (rotated, gently resting) -->
  <g transform="rotate(-62 116 124)">
    <path d="M84 84 q36 -10 72 0 l6 70 q-42 11 -84 0 Z" fill="url(#erPouch)"/>
    <path d="M84 84 q36 -10 72 0 l6 70 q-42 11 -84 0 Z" fill="#7BAE95" opacity="0.12"/>
    <path d="M82 78 q38 -10 76 0 l-3 11 q-35 -9 -70 0 Z" fill="url(#erGold)"/>
    <rect x="100" y="108" width="40" height="34" rx="8" fill="#FBF9F4" opacity="0.9"/>
    <rect x="100" y="108" width="40" height="34" rx="8" fill="none" stroke="url(#erGold)" stroke-width="2"/>
    <path d="M120 116 q9 4 0 18 q-9 -14 0 -18 Z" fill="#1E6F43"/>
  </g>
  <!-- spilled pieces -->
  <circle cx="150" cy="150" r="10" fill="url(#erBerry)"/>
  <circle cx="146" cy="146" r="1.1" fill="#F4D03F"/>
  <circle cx="154" cy="149" r="1.1" fill="#F4D03F"/>
  <circle cx="174" cy="144" r="7" fill="url(#erMango)"/>
  <circle cx="190" cy="152" r="5" fill="url(#erBerry)" opacity="0.92"/>
  <!-- reassuring leaf sprig -->
  <path d="M196 120 q18 -12 26 -30 q-4 22 -26 30 Z" fill="url(#erLeaf)"/>
  <path d="M196 120 q14 -8 22 -22" fill="none" stroke="#EDF3EE" stroke-width="1.2"/>
  <!-- gentle motion dots -->
  <circle cx="64" cy="92" r="2" fill="#B0852F" opacity="0.7"/>
  <circle cx="74" cy="80" r="1.5" fill="#EADFC6"/>
  <path d="M58 116 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 Z" fill="#EADFC6"/>
</svg>
